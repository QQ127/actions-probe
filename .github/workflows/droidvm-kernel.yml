name: droidvm-kernel
on:
  workflow_dispatch:
    inputs:
      unixnu_ref: {description: 'Droid-VM/UniXNU ref', default: 'wip/hackintosh'}
      device_ref: {description: 'Droid-VM/UniXNU-droidvm ref', default: 'wip/hackintosh'}
      only: {description: 'steps', default: 'setup,volumes,policies,data-base,reference,kernel'}
      chip: {description: 'unique-chip-id', default: '47554e5941480001'}
      runner: {default: 'macos-26'}
jobs:
  kernel:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: from-macos-droidvm
          path: ci
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Toolchain
        run: |
          xcodebuild -version || true
          brew install llvm lld cmake ninja unifdef mtools dtc openssl@3 || true
          brew --prefix openssl@3
      - name: Sources
        run: |
          git clone --filter=blob:none -b "${{ inputs.unixnu_ref }}" https://github.com/Droid-VM/UniXNU.git UniXNU
          git -C UniXNU submodule update --init --recursive --filter=blob:none
          git clone --filter=blob:none -b "${{ inputs.device_ref }}" https://github.com/Droid-VM/UniXNU-droidvm.git device
          git -C device submodule update --init --recursive --filter=blob:none
      - name: Patch legacy display (clang -Werror pointer-bool-conversion)
        run: |
          python3 - <<'PY2'
          import pathlib
          p = pathlib.Path("device/package/DroidVMVirtioGpu3D.cpp")
          s = p.read_text()
          old = "if (!gSurfaceUses || gSurfaceUseCount == MaxSurfaceUses)"
          new = "if (gSurfaceUseCount == MaxSurfaceUses)"
          if old not in s:
              raise SystemExit("patch pattern not found")
          p.write_text(s.replace(old, new))
          print("patched", p)
          PY2
      - name: Build (staged: reference first)
        working-directory: device
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/build-droidvm-all.py --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --unique-chip-id "${{ inputs.chip }}" \
            --only setup,volumes,policies,data-base,reference 2>&1 | tee /tmp/build.log
      - name: Build kernel (bootstrap-then-placeholder recipe)
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          jobs="-j $(sysctl -n hw.ncpu)"
          ./unixnu build kernel $jobs || echo "== first pass stopped as expected on a clean tree =="
          python3 "$GITHUB_WORKSPACE/ci/scripts/placeholder-archives.py" out/droidvm/tree || echo "placeholder step failed"
          ./unixnu build kernel $jobs 2>&1 | tee -a /tmp/build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p collect
          find "$GITHUB_WORKSPACE/UniXNU/out" -maxdepth 4 -name 'kernel.macho' -print -exec cp -v {} collect/ \; || true
          cp -v /tmp/build.log collect/build.log || true
          (cd "$GITHUB_WORKSPACE/UniXNU" && find out/droidvm -maxdepth 3 -type d -name logs -exec cp -R {} "$GITHUB_WORKSPACE/collect/" \; 2>/dev/null) || true
          ls -laR collect | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-plain
          path: collect
          if-no-files-found: warn
          retention-days: 14
