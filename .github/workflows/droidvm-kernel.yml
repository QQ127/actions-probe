name: droidvm-kernel
on:
  workflow_dispatch:
    inputs:
      unixnu_ref: {description: 'Droid-VM/UniXNU ref', default: 'wip/hackintosh'}
      device_ref: {description: 'Droid-VM/UniXNU-droidvm ref', default: 'wip/hackintosh'}
      only: {description: 'steps', default: 'setup,volumes,reference,kernel'}
      chip: {description: 'unique-chip-id (16 hex)', default: '47554e5941480001'}
      runner: {default: 'macos-26'}
jobs:
  kernel:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: from-macos-droidvm
          path: ci
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Toolchain
        run: |
          xcodebuild -version || true
          brew install llvm lld cmake ninja unifdef mtools dtc || true
      - name: Sources
        run: |
          git clone --filter=blob:none -b "${{ inputs.unixnu_ref }}" https://github.com/Droid-VM/UniXNU.git UniXNU
          git -C UniXNU submodule update --init --recursive --filter=blob:none
          git clone --filter=blob:none -b "${{ inputs.device_ref }}" https://github.com/Droid-VM/UniXNU-droidvm.git device
          git -C device submodule update --init --recursive --filter=blob:none
          git -C UniXNU log --oneline -1; git -C device log --oneline -1
          ls device/scripts | head
      - name: Build (device orchestrator)
        working-directory: device
        run: |
          python3 scripts/build-droidvm-all.py --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --unique-chip-id "${{ inputs.chip }}" \
            --only "${{ inputs.only }}" 2>&1 | tee /tmp/build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p collect
          find "$GITHUB_WORKSPACE/device/out" -maxdepth 5 -name 'kernel.macho' -print -exec cp -v {} collect/ \; || true
          cp -v /tmp/build.log collect/build.log || true
          (cd "$GITHUB_WORKSPACE/device" && find out -maxdepth 3 -type d -name logs -exec cp -R {} "$GITHUB_WORKSPACE/collect/" \; 2>/dev/null) || true
          ls -la collect | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-plain
          path: collect
          if-no-files-found: warn
          retention-days: 14
