name: droidvm-kernel
on:
  workflow_dispatch:
    inputs:
      unixnu_ref: {description: 'Droid-VM/UniXNU ref', default: 'wip/hackintosh'}
      device_ref: {description: 'Droid-VM/UniXNU-droidvm ref', default: 'wip/hackintosh'}
      runner: {default: 'macos-26'}
jobs:
  kernel:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: from-macos-droidvm
          path: ci
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Toolchain
        run: |
          xcodebuild -version || true
          brew install llvm lld cmake ninja unifdef mtools dtc || true
      - name: Sources
        run: |
          git clone --filter=blob:none -b "${{ inputs.unixnu_ref }}" https://github.com/Droid-VM/UniXNU.git UniXNU
          git -C UniXNU submodule update --init --recursive --filter=blob:none
          git clone --filter=blob:none -b "${{ inputs.device_ref }}" https://github.com/Droid-VM/UniXNU-droidvm.git device
          git -C device submodule update --init --recursive --filter=blob:none
          git -C UniXNU log --oneline -1; git -C device log --oneline -1
      - name: Fetch
        working-directory: UniXNU
        run: |
          ./unixnu defconfig droidvm_defconfig -D ../device
          ./unixnu fetch
      - name: Build kernel
        working-directory: UniXNU
        run: |
          jobs="-j $(sysctl -n hw.ncpu)"
          extra=""
          if [ -d "$GITHUB_WORKSPACE/ci/local" ]; then extra="--local $GITHUB_WORKSPACE/ci/local"; fi
          echo "extra=$extra"
          tree="out/droidvm/tree"
          ./unixnu build kernel $jobs $extra || echo "== first pass stopped =="
          if [ -f "$GITHUB_WORKSPACE/ci/scripts/placeholder-archives.py" ] && [ ! -f "$tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/startup.o.json" ]; then
            python3 "$GITHUB_WORKSPACE/ci/scripts/placeholder-archives.py" "$tree" || echo "placeholder step failed"
          fi
          ./unixnu build kernel $jobs $extra
      - name: Collect
        if: always()
        run: |
          mkdir -p collect
          find UniXNU/out -maxdepth 5 -name 'kernel.macho' -print -exec cp -v {} collect/ \; || true
          (cd UniXNU && find out -maxdepth 4 -type d -name logs -exec cp -R {} "$GITHUB_WORKSPACE/collect/" \; 2>/dev/null) || true
          ls -la collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-plain
          path: collect
          if-no-files-found: warn
          retention-days: 14
