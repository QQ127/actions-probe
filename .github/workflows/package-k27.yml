name: Package macOS 27.2 VMPKG
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'image workflow 的 run id (默认取最新成功)'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - name: Resolve source artifact
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          RUN="${SOURCE_RUN}"
          if [ -z "$RUN" ]; then
            RUN=$(gh api repos/${{ github.repository }}/actions/workflows/image.yml/runs \
              --jq '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .id' | head -1)
          fi
          echo "source run: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Download encrypted image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          gh run download "${{ steps.src.outputs.run }}" \
            --repo "${{ github.repository }}" \
            --name "image-27.2-2" \
            --dir "$RUNNER_TEMP/image"
          echo "=== downloaded ==="
          find "$RUNNER_TEMP/image" -type f -printf '%f %s bytes\n' | sort
          echo "=== unpacking bundle ==="
          cd "$RUNNER_TEMP/image"
          unzip -q image-27.2-2.zip -d bundle || true
          ls -lh bundle/ 2>/dev/null || ls -lh

      - name: Decrypt with ARTIFACT_KEY
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/image"
          BUNDLE="$RUNNER_TEMP/image/bundle"
          [ -d "$BUNDLE" ] || BUNDLE="$RUNNER_TEMP/image"
          CI_BLOB="$GITHUB_WORKSPACE/ci/scripts/ci-blob.sh"
          [ -f "$CI_BLOB" ] || CI_BLOB="$(pwd)/ci/scripts/ci-blob.sh"
          echo "ci-blob.sh at: $CI_BLOB"
          bash "$CI_BLOB" unpack "$RUNNER_TEMP/unpacked" "$BUNDLE"/image.tar.zst.enc.[0-9][0-9][0-9]
          echo "=== unpacked files ==="
          ls -lh "$RUNNER_TEMP/unpacked"

      - name: Install deps & pack vmpkg
        run: |
          set -euo pipefail
          python3 -m pip install --quiet zstandard || true
          python3 "$GITHUB_WORKSPACE/ci/tools/pack_real.py" \
            --srcdir "$RUNNER_TEMP/unpacked" \
            --output "$RUNNER_TEMP/macos-27.2.vmpkg" \
            --vm-name "macOS 27.2" \
            --compression gzip

      - name: Upload VMPKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-27.2-vmpkg
          path: ${{ runner.temp }}/macos-27.2.vmpkg
          compression-level: 0
          retention-days: 30
