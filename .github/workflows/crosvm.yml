name: crosvm-macos
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Env
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config unzip curl python3
          curl -sSLo ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-linux-android aarch64-unknown-none-softfloat
      - name: Clone
        run: |
          git clone --depth 1 -b macOS https://github.com/Droid-VM/crosvm.git crosvm
          rm -rf crosvm/third_party/minijail
          git clone --depth 1 https://chromium.googlesource.com/chromiumos/platform/minijail crosvm/third_party/minijail
      - name: Build droidvm-shim
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cd crosvm/droidvm-shim
          cargo build --release
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" -O binary target/aarch64-unknown-none-softfloat/release/droidvm-shim ../hypervisor/src/gunyah/shim.bin
          ls -l ../hypervisor/src/gunyah/shim.bin
      - name: Build libcap
        run: |
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          curl -sSLO https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.69.tar.gz
          tar xf libcap-2.69.tar.gz
          cd libcap-2.69
          make -j4 CC="$CC" AR="$AR" BUILD_CC=gcc BUILD_AR=ar USE_GPERF=no PAM_CAP=no LIBATTR=no RAISE_SETFCAP=no -C libcap libcap.a
          mkdir -p sysroot/usr/include/sys sysroot/usr/lib
          cp libcap/include/sys/capability.h sysroot/usr/include/sys/
          cp libcap/libcap.a sysroot/usr/lib/
          ls sysroot/usr/include/sys/capability.h sysroot/usr/lib/libcap.a
      - name: Cross wrappers
        run: |
          mkdir -p $HOME/xb
          B="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '#!/bin/sh\nexec "%s/aarch64-linux-android24-clang" "$@"\n' "$B" > $HOME/xb/aarch64-android--gcc
          printf '#!/bin/sh\nexec "%s/aarch64-linux-android24-clang++" "$@"\n' "$B" > $HOME/xb/aarch64-android--g++
          printf '#!/bin/sh\nexec "%s/llvm-ar" "$@"\n' "$B" > $HOME/xb/aarch64-android--ar
          printf '#!/bin/sh\nexec "%s/llvm-ranlib" "$@"\n' "$B" > $HOME/xb/aarch64-android--ranlib
          printf '#!/bin/sh\nexec "%s/llvm-objcopy" "$@"\n' "$B" > $HOME/xb/aarch64-android--objcopy
          printf '#!/bin/sh\nexec "%s/llvm-strip" "$@"\n' "$B" > $HOME/xb/aarch64-android--strip
          chmod +x $HOME/xb/*
          echo "$HOME/xb" >> $GITHUB_PATH
      - name: Build crosvm
        working-directory: crosvm
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_aarch64_linux_android: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CFLAGS: "-I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include -Wno-implicit-function-declaration -Wno-error=implicit-function-declaration"
          CPPFLAGS: "-I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include"
          LDFLAGS: "-L/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/lib"
          RUSTFLAGS: "-L native=/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/lib"
        run: |
          grep -rl '^rand = "0.8"' --include=Cargo.toml . | xargs -r sed -i 's/^rand = "0.8"/rand = "0.9"/'
          test -f /tmp/minijail_fexecve.c || true
          printf '%s\n' '#ifdef __ANDROID__' '#include <errno.h>' 'static int fexecve(int fd, char *const a[], char *const e[]) { (void)fd; (void)a; (void)e; errno = ENOSYS; return -1; }' '#endif' > /tmp/stub.h
          sed -i '1e cat /tmp/stub.h' third_party/minijail/libminijail.c
          head -8 third_party/minijail/libminijail.c
          rm -f Cargo.lock
          set +e
          cargo build --release --target aarch64-linux-android --features gunyah > /tmp/build.log 2>&1
          rc=$?
          echo "exit=$rc"
          grep -E "^error|error\[|cannot find|not found" /tmp/build.log | head -20
          tail -25 /tmp/build.log
          exit $rc
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-android
          path: |
            crosvm/target/aarch64-linux-android/release/crosvm
            /tmp/build.log
          if-no-files-found: warn
