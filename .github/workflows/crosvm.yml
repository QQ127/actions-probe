name: crosvm-macos
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Env
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^URIs: /URIs: /' /etc/apt/sources.list.d/ubuntu.sources || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe" | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libssl-dev \
            libdrm-dev libwayland-dev wayland-protocols protobuf-compiler gcc-aarch64-linux-gnu python3 curl
          sudo apt-get install -y -qq libwayland-dev:arm64 libdrm-dev:arm64 libxkbcommon-dev:arm64 libcap-dev:arm64 || true
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-unknown-linux-gnu
      - name: Build libcap for aarch64
        run: |
          curl -sSLO https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.69.tar.gz
          tar xf libcap-2.69.tar.gz
          cd libcap-2.69
          make -j4 CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar BUILD_CC=gcc BUILD_AR=ar OBJCOPY=aarch64-linux-gnu-objcopy \
            RANLIB=aarch64-linux-gnu-ranlib STRIP=aarch64-linux-gnu-strip \
            GOLANG=no PAM_CAP=no USE_GPERF=no LIBATTR=no RAISE_SETFCAP=no \
            DESTDIR=$PWD/sysroot prefix=/usr lib=lib install
          ls sysroot/usr/lib/libcap.a sysroot/usr/lib/pkgconfig/libcap.pc
      - name: Clone
        run: |
          git clone --depth 1 -b macOS https://github.com/Droid-VM/crosvm.git crosvm
          rm -rf crosvm/third_party/minijail
          git clone --depth 1 https://chromium.googlesource.com/chromiumos/platform/minijail crosvm/third_party/minijail
      - name: Build droidvm-shim
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustup target add --toolchain stable aarch64-unknown-none-softfloat
          cd crosvm/droidvm-shim
          cargo build --release
          ELF=$(ls target/aarch64-unknown-none-softfloat/release/droidvm-shim)
          aarch64-linux-gnu-objcopy -O binary "$ELF" ../hypervisor/src/gunyah/shim.bin
          ls -l ../hypervisor/src/gunyah/shim.bin
      - name: Build
        working-directory: crosvm
        env:
          RUSTUP_TOOLCHAIN: stable
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: "-C target-feature=+crt-static -L native=/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/lib"
          PKG_CONFIG_PATH: /home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CFLAGS: "-I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include"
          CPPFLAGS: "-I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include"
          CFLAGS_aarch64_unknown_linux_gnu: "-I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include"
          LDFLAGS: "-L/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/lib"
        run: |
          set +e
          grep -rl '^rand = "0.8"' --include=Cargo.toml . | xargs -r sed -i 's/^rand = "0.8"/rand = "0.9"/'
          grep -rn '^rand = ' --include=Cargo.toml . | head
          rm -f Cargo.lock
          cargo build --release --target aarch64-unknown-linux-gnu \
            --features gunyah > /tmp/build.log 2>&1
          rc=$?
          echo "exit=$rc"
          grep -E "^error|error\[|cannot find|not found" /tmp/build.log | head -20
          tail -25 /tmp/build.log
          exit $rc
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-aarch64
          path: |
            crosvm/target/aarch64-unknown-linux-gnu/release/crosvm
            /tmp/build.log
          if-no-files-found: warn
