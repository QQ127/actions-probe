name: crosvm-macos
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Env
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config unzip curl python3 libwayland-bin wayland-protocols libwayland-dev
          sudo dpkg --add-architecture arm64 || true
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe" | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update -qq
          mkdir -p sysroot debs && cd debs
          apt-get download libwayland-dev:arm64 libwayland-client0:arm64 libwayland-server0:arm64 libwayland-cursor0:arm64 libwayland-egl1:arm64 2>/dev/null || true
          for d in *.deb; do dpkg -x "$d" ../sysroot; done
          cd ..
          curl -sSLo ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-linux-android aarch64-unknown-none-softfloat
      - name: Clone
        run: |
          git clone --depth 1 -b macOS https://github.com/Droid-VM/crosvm.git crosvm
          rm -rf crosvm/third_party/minijail
          git clone --depth 1 https://chromium.googlesource.com/chromiumos/platform/minijail crosvm/third_party/minijail
      - name: Build droidvm-shim
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cd crosvm/droidvm-shim
          cargo build --release
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy" -O binary target/aarch64-unknown-none-softfloat/release/droidvm-shim ../hypervisor/src/gunyah/shim.bin
      - name: Build libcap
        run: |
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          curl -sSLO https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.69.tar.gz
          tar xf libcap-2.69.tar.gz
          cd libcap-2.69
          make -j4 CC="$CC" AR="$AR" BUILD_CC=gcc BUILD_AR=ar USE_GPERF=no PAM_CAP=no LIBATTR=no RAISE_SETFCAP=no -C libcap libcap.a
          mkdir -p sysroot/usr/include/sys sysroot/usr/lib
          cp libcap/include/sys/capability.h sysroot/usr/include/sys/
          cp libcap/libcap.a sysroot/usr/lib/
      - name: Cross wrappers
        run: |
          mkdir -p $HOME/xb
          B="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '#!/bin/sh\nexec "%s/aarch64-linux-android24-clang" "$@"\n' "$B" > $HOME/xb/aarch64-android--gcc
          printf '#!/bin/sh\nexec "%s/aarch64-linux-android24-clang++" "$@"\n' "$B" > $HOME/xb/aarch64-android--g++
          printf '#!/bin/sh\nexec "%s/llvm-ar" "$@"\n' "$B" > $HOME/xb/aarch64-android--ar
          printf '#!/bin/sh\nexec "%s/llvm-ranlib" "$@"\n' "$B" > $HOME/xb/aarch64-android--ranlib
          printf '#!/bin/sh\nexec "%s/llvm-objcopy" "$@"\n' "$B" > $HOME/xb/aarch64-android--objcopy
          printf '#!/bin/sh\nexec "%s/llvm-strip" "$@"\n' "$B" > $HOME/xb/aarch64-android--strip
          chmod +x $HOME/xb/*
          echo "$HOME/xb" >> $GITHUB_PATH
      - name: Build libvncserver
        run: |
          git clone --depth 1 https://github.com/Droid-VM/libvncserver.git lvnc
          cmake -S lvnc -B lvnc-build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX=$PWD/lvnc-sysroot \
            -DWITH_JPEG=OFF -DWITH_PNG=OFF -DWITH_ZLIB=OFF -DWITH_LZO=OFF \
            -DWITH_GCRYPT=OFF -DWITH_SDL=OFF -DWITH_GTK=OFF -DWITH_FFMPEG=OFF \
            -DWITH_TESTS=OFF -DWITH_EXAMPLES=OFF -DLIBVNCSERVER_WITH_WEBSOCKETS=OFF
          cmake --build lvnc-build -j4
          cmake --install lvnc-build
          ls lvnc-sysroot/include/rfb/rfb.h lvnc-sysroot/lib
      - name: Build crosvm
        working-directory: crosvm
        env:
          RUSTUP_TOOLCHAIN: stable
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_aarch64_linux_android: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: /home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CFLAGS: "-I/home/runner/work/actions-probe/actions-probe/lvnc-sysroot/include -I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include -I/home/runner/work/actions-probe/actions-probe/sysroot/usr/include -Wno-error -Wno-implicit-function-declaration -Wno-unused-command-line-argument"
          CPPFLAGS: "-I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include"
          LDFLAGS: "-L/home/runner/work/actions-probe/actions-probe/lvnc-sysroot/lib -L/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/lib -L/home/runner/work/actions-probe/actions-probe/sysroot/usr/lib/aarch64-linux-gnu"
          RUSTFLAGS: "-L native=/tmp/stublib -L native=/home/runner/work/actions-probe/actions-probe/lvnc-sysroot/lib -L native=/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/lib -L native=/home/runner/work/actions-probe/actions-probe/sysroot/usr/lib/aarch64-linux-gnu"
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: "--sysroot=/home/runner/work/actions-probe/actions-probe/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/sysroot -I/home/runner/work/actions-probe/actions-probe/libcap-2.69/sysroot/usr/include"
        run: |
          grep -rl '^rand = "0.8"' --include=Cargo.toml . | xargs -r sed -i 's/^rand = "0.8"/rand = "0.9"/'
          printf '%s\n' '#ifdef __ANDROID__' '#include <errno.h>' '#include <unistd.h>' '#include <sys/syscall.h>' 'static int fexecve(int fd, char *const a[], char *const e[]) { (void)fd; (void)a; (void)e; errno = ENOSYS; return -1; }' 'static int unshare(int f) { return (int)syscall(__NR_unshare, f); }' 'static int setns(int fd, int t) { return (int)syscall(__NR_setns, fd, t); }' '#endif' > /tmp/stub.h
          sed -i '1e cat /tmp/stub.h' third_party/minijail/libminijail.c
          sed -i '/_Static_assert/d' third_party/minijail/system.c
          python3 ../scripts/patch_buildrs.py
          mkdir -p /tmp/stublib && $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar rcs /tmp/stublib/libprocessgroup.a
          rm -f Cargo.lock
          set +e
          cargo build --release --target aarch64-linux-android --features gunyah,android_display,vnc,gpu_display/android_display > /tmp/build.log 2>&1
          rc=$?
          echo "exit=$rc"
          grep -E "^error|error\[|cannot find|undefined symbol" /tmp/build.log | head -30
          tail -20 /tmp/build.log
          exit $rc
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-android
          path: |
            crosvm/target/aarch64-linux-android/release/crosvm
            /tmp/build.log
          if-no-files-found: warn
