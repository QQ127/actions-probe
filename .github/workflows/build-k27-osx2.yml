name: build-k27-osx2

# Experiment: keep none24smu/UniXNU ios26's OWN 21 patches (known to build installhdrs +
# compile the arm64 iOS kernel), and switch ONLY the kernel compile flags to the macOS
# target (arm64e + XNU_TARGET_OS_OSX + macosx SDK). Isolates whether the macOS target
# flags work independently of the DroidVM 47-patch series (which broke installhdrs when
# mixed with this script's KDK).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout UniXNU ios26 (build script + 21 patches)
        uses: actions/checkout@v4
        with:
          repository: none24smu/UniXNU
          ref: ios26
          path: unixnu-ios26

      - name: Install host tools
        run: brew install unifdef cmake ninja

      - name: Switch build_kernel to arm64e + macOS target
        run: |
          cd unixnu-ios26
          sed -i.bak \
            -e 's|SDKROOT="${XNU_SDKROOT:-iphoneos}"|SDKROOT="${XNU_SDKROOT:-macosx}"|' \
            -e 's|ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 |ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64e |' \
            -e 's|-miphoneos-version-min=$IOS_MIN -DXNU_TARGET_OS_IOS|-mmacosx-version-min=$IOS_MIN -DXNU_TARGET_OS_OSX|' \
            -e 's|-Wl,-ios_version_min,$IOS_MIN|-Wl,-macosx_version_min,$IOS_MIN|' \
            scripts/build-xnu-12377.sh
          grep -nE "SDKROOT=|ARCH_STRING_FOR|TARGET_OS|version_min" scripts/build-xnu-12377.sh | head -20

      - name: Build xnu-12377 arm64e macOS kernel (full log)
        working-directory: unixnu-ios26
        run: |
          echo "== toolchain =="
          xcodebuild -version
          clang --version | head -2
          echo "== build =="
          set +e
          JOBS=$(sysctl -n hw.ncpu) bash scripts/build-xnu-12377.sh > /tmp/build.log 2>&1
          rc=$?
          echo "build rc=$rc"
          tail -60 /tmp/build.log
          exit $rc

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osx2-build-log
          path: /tmp/build.log
          if-no-files-found: error

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-12377-osx2-kernel
          path: |
            unixnu-ios26/build/xnu-12377.121.6/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837*
          if-no-files-found: ignore
          retention-days: 7
